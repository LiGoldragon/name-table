[package]
name         = "name-table"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/name-table"
description  = "The stringless-Core identifier space: Identifier indices, the interning NameTable with a transactional staging surface, and the one home for the derived-name walkers."
publish      = false

[lib]
name = "name_table"
path = "src/lib.rs"

[dependencies]
content-identity = { git = "https://github.com/LiGoldragon/content-identity.git", rev = "2fab7276807bf22c3e804f9ff7afbdc0895c1542" }
rkyv             = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror        = "2"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
